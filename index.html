function renderProcedimientos(){
  const wrap = el('div',{id:'procedimientos-container'});
  const card = el('div',{class:'card'});
  card.appendChild(el('h3',{},'Procedimientos Pilotos DFY'));
  card.appendChild(el('div',{class:'sub'},'Elige una categoría para ver los documentos disponibles.'));

  const btnRow = el('div',{style:'display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;'});
  const categorias = [['INGRESO','Ingreso'],['MIGRACION','Migración'],['CONVALIDACION','Convalidación']];
  categorias.forEach(([key,label])=>{
    const b = el('button',{class:'tab'+(state.procCategoria===key?' active':''), style:'border:1px solid var(--line);border-radius:8px;'}, label);
    b.addEventListener('click', ()=>{ state.procCategoria = (state.procCategoria===key ? null : key); refrescarProcedimientos(); });
    btnRow.appendChild(b);
  });
  card.appendChild(btnRow);
  wrap.appendChild(card);

  if(state.procCategoria){
    const docs = DOCUMENTOS_PROCEDIMIENTOS[state.procCategoria] || [];
    const docCard = el('div',{class:'card'});
    docCard.appendChild(el('h3',{}, state.procCategoria));
    if(docs.length === 0){
      docCard.appendChild(el('div',{class:'empty'},'Todavía no hay documentos cargados en esta categoría.'));
    } else {
      const list = el('div',{class:'pilot-list'});
      docs.forEach(doc=>{
        const item = el('a',{href:doc.url, target:'_blank', rel:'noopener', class:'pilot-item', style:'text-decoration:none;'},[
          el('div',{class:'name'}, doc.titulo),
        ]);
        list.appendChild(item);
      });
      docCard.appendChild(list);
    }
    wrap.appendChild(docCard);
  }
  return wrap;
}

/* ---------------- VISTA PILOTO ---------------- */
async function renderPiloto(){
  const app = el('div',{class:'app'});
  app.appendChild(renderTopbar('Licencia '+(state.session.licencia||'-')+' · Legajo '+(state.session.legajo||'-')));

  const tabs = el('div',{class:'tabs'});
  const tabDefs = [['nuevo','Nuevo vuelo'],['bitacora','Mi bitácora'],['reporte','Reporte'],['miinformacion','Mi información'],['procedimientos','Procedimientos Pilotos DFY']];
  tabDefs.forEach(([key,label])=>{
    const t = el('button',{class:'tab'+(state.tab===key?' active':'')},label);
    t.addEventListener('click', ()=>{state.tab=key; state.editingVuelo=null; state.paginaTabla=null; render();});
    tabs.appendChild(t);
  });
  app.appendChild(tabs);

  const content = el('div',{},[renderSpinner()]);
  app.appendChild(content);
  document.getElementById('root').innerHTML='';
  document.getElementById('root').appendChild(app);

  if(state.tab==='reporte'){
    content.innerHTML='';
    content.appendChild(renderReporte());
    return;
  }
  if(state.tab==='miinformacion'){
    const [rMig, rDoc] = await Promise.all([
      apiGet({action:'estadoMigratorio', usuario: state.session.usuario}),
      apiGet({action:'documentos'})
    ]);
    content.innerHTML='';
    if(!rMig.ok){ content.appendChild(el('div',{class:'empty'},rMig.error||'Error cargando datos')); return; }
    content.appendChild(renderMigratorio(rMig.estado));
    content.appendChild(renderDocumentosPiloto(rDoc.ok ? (rDoc.documentos||{}) : {}));
    return;
  }
  if(state.tab==='procedimientos'){
    content.innerHTML='';
    content.appendChild(renderProcedimientos());
    return;
  }

  const [r, catRes, hiRes] = await Promise.all([
    apiGet({action:'misVuelos', usuario: state.session.usuario}),
    apiGet({action:'catalogos'}),
    apiGet({action:'horasIniciales'})
  ]);
  const catalogos = catRes.ok ? catRes : {aviones:[],simuladores:[],instructores:[]};
  content.innerHTML='';
  if(!r.ok){ content.appendChild(el('div',{class:'empty'},r.error||'Error cargando datos')); return; }

  content.appendChild(renderGauges(r.totales));
  if(state.tab==='nuevo'){
    content.appendChild(renderForm(()=>{ state.paginaTabla=null; render(); }, null, r.totales.TotalHoras, null, catalogos));
  } else if(state.editingVuelo){
    content.appendChild(renderForm(
      ()=>{ state.editingVuelo=null; render(); },
      state.editingVuelo,
      r.totales.TotalHoras,
      ()=>{ state.editingVuelo=null; render(); },
      catalogos
    ));
  } else {
    content.appendChild(renderTable(r.vuelos, {
      onEdit: (v)=>{ state.editingVuelo=v; render(); },
      onDelete: async (v, elLink)=>{
        if(!confirm('¿Eliminar este vuelo? Esta acción no se puede deshacer.')) return;
        elLink.textContent = 'Eliminando...';
        elLink.style.pointerEvents = 'none';
        elLink.style.opacity = '0.5';
        try{
          const res = await apiPost({action:'eliminarVuelo', ID:v.ID, Usuario: state.session.usuario});
          if(res.ok){ showToast('Vuelo eliminado ✓'); render(); }
          else {
            showToast(res.error || 'Error al eliminar');
            elLink.textContent='Eliminar'; elLink.style.pointerEvents='auto'; elLink.style.opacity='1';
          }
        }catch(e){
          showToast('No se pudo conectar.');
          elLink.textContent='Eliminar'; elLink.style.pointerEvents='auto'; elLink.style.opacity='1';
        }
      }
    }));
    content.appendChild(renderHorasIniciales(hiRes.ok ? hiRes.horas : null));
  }
}

/* ---------------- VISTA ADMIN ---------------- */
async function renderAdmin(){
  const app = el('div',{class:'app'});
  app.appendChild(renderTopbar('Panel del instructor'));

  const tabs = el('div',{class:'tabs'});
  const tabDefsAdmin = [['inicio','Inicio'],['pilotos','Pilotos'],['reportes','Reportes'],['estadisticas','Estadísticas']];
  tabDefsAdmin.forEach(([key,label])=>{
    const t = el('button',{class:'tab'+(state.adminTab===key?' active':'')},label);
    t.addEventListener('click', ()=>{state.adminTab=key; state.adminSelected=null; state.mostrarFormPiloto=false; state.expandido.secciones={}; state.expandido.horasDreamFlyAnios={}; state.expandido.horasDreamFlyMes={}; state.paginaTabla=null; render();});
    tabs.appendChild(t);
  });
  app.appendChild(tabs);

  const content = el('div',{},[renderSpinner()]);
  app.appendChild(content);
  document.getElementById('root').innerHTML='';
  document.getElementById('root').appendChild(app);

  if(state.adminTab==='inicio'){
    const r = await apiGet({action:'alertasAdmin'});
    content.innerHTML='';
    if(!r.ok){ content.appendChild(el('div',{class:'empty'},r.error||'Error cargando datos')); return; }

    const cardNuevos = el('div',{class:'card'});
    cardNuevos.appendChild(el('h3',{},'Nuevos vuelos'));
    cardNuevos.appendChild(el('div',{class:'sub'},'Vuelos y sesiones de simulador registrados hoy.'));
    if(!r.nuevosVuelosHoy || r.nuevosVuelosHoy.length === 0){
      cardNuevos.appendChild(el('div',{class:'empty'},'Todavía no se registró ningún vuelo hoy.'));
    } else {
      const list = el('div',{class:'pilot-list'});
      r.nuevosVuelosHoy.forEach(v=>{
        const item = el('div',{class:'pilot-item', style:'cursor:default;'},[
          el('div',{},[
            el('div',{class:'name'}, v.piloto),
            el('div',{class:'meta'}, formatFecha(v.fecha)+' · '+(v.tipoVuelo||'-')+' · '+(v.matricula||'-')+' · '+(v.instructor||'-')+' · '+(v.desde||'-')+' → '+(v.hasta||'-'))
          ]),
          el('div',{class:'hours mono'}, fmt(v.horas)+' h')
        ]);
        list.appendChild(item);
      });
      cardNuevos.appendChild(list);
    }
    content.appendChild(cardNuevos);

    const cardReportes = el('div',{class:'card'});
    cardReportes.appendChild(el('h3',{},'Reportes sin leer'));
    if(r.reportesNoLeidos > 0){
      const irBtn = el('button',{class:'btn-secondary', style:'margin-top:8px;'}, 'Ver '+r.reportesNoLeidos+' reporte'+(r.reportesNoLeidos===1?'':'s')+' nuevo'+(r.reportesNoLeidos===1?'':'s'));
      irBtn.addEventListener('click', ()=>{ state.adminTab='reportes'; render(); });
      cardReportes.appendChild(el('div',{class:'val mono', style:'font-size:26px;color:var(--amber);margin-bottom:4px;'}, String(r.reportesNoLeidos)));
      cardReportes.appendChild(irBtn);
    } else {
      cardReportes.appendChild(el('div',{class:'sub'},'No hay reportes nuevos.'));
    }
    content.appendChild(cardReportes);

    const cardPrecarias = el('div',{class:'card'});
    cardPrecarias.appendChild(el('h3',{},'Precarias por vencer (próximos 30 días)'));
    if(r.precariasPorVencer.length === 0){
      cardPrecarias.appendChild(el('div',{class:'sub'},'No hay precarias por vencer en los próximos 30 días.'));
    } else {
      const list = el('div',{class:'pilot-list'});
      r.precariasPorVencer.forEach(p=>{
        const urgente = p.dias < 0;
        const etiqueta = urgente ? 'Vencida hace '+Math.abs(p.dias)+' día'+(Math.abs(p.dias)===1?'':'s') : (p.dias===0 ? 'Vence hoy' : 'Vence en '+p.dias+' día'+(p.dias===1?'':'s'));
        const item = el('div',{class:'pilot-item'},[
          el('div',{},[
            el('div',{class:'name'}, (p.nombre||p.usuario)+' '+(p.apellido||'')),
            el('div',{class:'meta'}, formatFecha(p.fechaVence))
          ]),
          el('div',{class:'hours mono', style:'font-size:13px;color:'+(urgente?'var(--danger)':'var(--amber)')+';'}, etiqueta)
        ]);
        item.addEventListener('click', ()=>{ state.adminTab='pilotos'; state.adminSelected=p.usuario; state.paginaTabla=null; render(); });
        list.appendChild(item);
      });
      cardPrecarias.appendChild(list);
    }
    content.appendChild(cardPrecarias);

    const cardHoras250 = el('div',{class:'card'});
    cardHoras250.appendChild(el('h3',{},'Pilotos próximos 250h'));
    if(!r.pilotosProximos250 || r.pilotosProximos250.length === 0){
      cardHoras250.appendChild(el('div',{class:'sub'},'No hay pilotos entre 200 y 250 horas (o por encima) pendientes de revisar.'));
    } else {
      const list = el('div',{class:'pilot-list'});
      r.pilotosProximos250.forEach(p=>{
        const item = el('div',{class:'pilot-item'});
        const izq = el('div',{style:'cursor:pointer;flex:1;'},[
          el('div',{class:'name'}, (p.nombre||p.usuario)+' '+(p.apellido||'')),
          el('div',{class:'meta'}, fmt(p.horas)+' horas totales')
        ]);
        izq.addEventListener('click', ()=>{ state.adminTab='pilotos'; state.adminSelected=p.usuario; state.paginaTabla=null; render(); });
        item.appendChild(izq);
        const del = el('span',{class:'back-link', style:'color:var(--danger);white-space:nowrap;'}, 'Eliminar notificación');
        del.addEventListener('click', async (ev)=>{
          ev.stopPropagation();
          const res = await apiPost({action:'descartarNotificacion250', Usuario:p.usuario});
          if(res.ok){ showToast('Notificación eliminada ✓'); render(); } else { showToast(res.error || 'Error al eliminar'); }
        });
        item.appendChild(del);
        list.appendChild(item);
      });
      cardHoras250.appendChild(list);
    }
    content.appendChild(cardHoras250);
    return;
  }

  if(state.adminTab==='reportes'){
    const r = await apiGet({action:'reportesAdmin'});
    content.innerHTML='';
    if(!r.ok){ content.appendChild(el('div',{class:'empty'},r.error||'Error cargando datos')); return; }
    if(!r.reportes.length){ content.appendChild(el('div',{class:'empty'},'Todavía no hay reportes.')); return; }
    r.reportes.forEach(rep=>{
      const card = el('div',{class:'card'});
      card.appendChild(el('div',{style:'white-space:pre-wrap;font-size:13px;line-height:1.5;'}, rep.mensaje));
      const pie = el('div',{style:'display:flex;align-items:center;justify-content:space-between;margin-top:10px;'});
      pie.appendChild(el('div',{style:'color:var(--muted);font-size:11px;'}, formatFechaHora(rep.fecha)));
      const del = el('span',{class:'back-link', style:'color:var(--danger);'}, 'Eliminar');
      del.addEventListener('click', async ()=>{
        if(!confirm('¿Eliminar este reporte? Esta acción no se puede deshacer.')) return;
        del.textContent = 'Eliminando...';
        del.style.pointerEvents = 'none';
        del.style.opacity = '0.5';
        const res = await apiPost({action:'eliminarReporte', ID: rep.id});
        if(res.ok){ showToast('Reporte eliminado ✓'); render(); }
        else {
          showToast(res.error || 'Error al eliminar');
          del.textContent = 'Eliminar'; del.style.pointerEvents='auto'; del.style.opacity='1';
        }
      });
      pie.appendChild(del);
      card.appendChild(pie);
      content.appendChild(card);
    });
    apiPost({action:'marcarReportesLeidos'}).catch(()=>{});
    return;
  }

  if(state.adminTab==='estadisticas'){
    const [r, catRes] = await Promise.all([
      apiGet({action:'resumenAdmin'}),
      apiGet({action:'catalogos'})
    ]);
    content.innerHTML='';
    if(!r.ok){ content.appendChild(el('div',{class:'empty'},r.error||'Error cargando datos')); return; }
    const catalogos = catRes.ok ? catRes : {aviones:[],simuladores:[],instructores:[]};
    state.cacheEstadisticas = { pilotos: r.pilotos, catalogos: catalogos };
    const estContainer = el('div',{id:'estadisticas-container'});
    estContainer.appendChild(renderEstadisticasAdmin(r.pilotos, catalogos));
    content.appendChild(estContainer);
    return;
  }

  const r = await apiGet({action:'resumenAdmin'});
  content.innerHTML='';
  if(!r.ok){ content.appendChild(el('div',{class:'empty'},r.error||'Error cargando datos')); return; }

  if(state.adminSelected){
    const p = r.pilotos.find(x=>x.usuario===state.adminSelected);
    if(!p){ state.adminSelected=null; render(); return; }
    const back = el('span',{class:'back-link'},'← Volver a la lista de pilotos');
    back.addEventListener('click', ()=>{state.adminSelected=null; state.paginaTabla=null; render();});
    content.appendChild(back);
    content.appendChild(el('h2',{style:'margin:0 0 4px;font-size:18px;'}, p.nombre+' '+p.apellido));
    content.appendChild(el('p',{style:'color:var(--muted);font-size:12px;margin:0 0 16px;'}, 'Licencia '+(p.licencia||'-')+' · Legajo '+(p.legajo||'-')));

    const btnRowPerfil = el('div',{style:'display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;'});

    const informeBtn = el('button',{class:'btn-secondary'}, '🖨 Generar / Imprimir informe');
    informeBtn.addEventListener('click', ()=> generarInformePiloto(p));
    btnRowPerfil.appendChild(informeBtn);

    const bajaBtn = el('button',{class:'btn-secondary', style:'color:var(--danger);border-color:var(--danger);'}, 'Dar de baja a este piloto');
    bajaBtn.addEventListener('click', async ()=>{
      if(!confirm('¿Dar de baja a '+p.nombre+' '+p.apellido+'? Se van a borrar TODOS sus vuelos registrados. Esta acción no se puede deshacer.')) return;
      const res = await apiPost({action:'eliminarPiloto', Usuario: p.usuario});
      if(res.ok){ showToast('Piloto dado de baja ✓'); state.adminSelected=null; render(); }
      else { showToast(res.error || 'Error al dar de baja'); }
    });
    btnRowPerfil.appendChild(bajaBtn);
    content.appendChild(btnRowPerfil);

    content.appendChild(renderGauges(p.totales));
    state.cachePilotoVuelos = p.vuelos;
    const estPilotoContainer = el('div',{id:'estadisticas-piloto-container'});
    estPilotoContainer.appendChild(renderEstadisticasPiloto(p.vuelos));
    content.appendChild(estPilotoContainer);
    content.appendChild(renderTable(p.vuelos));
    content.appendChild(renderMigratorioResumen(p.migratorio));
    content.appendChild(renderDocumentosAdmin(p));
    return;
  }

  const altaBtn = el('button',{class:'btn-primary', style:'max-width:220px;margin-bottom:16px;'}, state.mostrarFormPiloto ? 'Cancelar' : '+ Agregar piloto');
  content.appendChild(altaBtn);

  // Contenedor propio del formulario: mostrarlo/ocultarlo no necesita recargar
  // toda la sección desde el servidor, es solo un formulario vacío.
  const contenedorFormAlta = el('div',{});
  if(state.mostrarFormPiloto){
    contenedorFormAlta.appendChild(renderFormAltaPiloto(()=>{ state.mostrarFormPiloto=false; render(); }));
  }
  content.appendChild(contenedorFormAlta);

  altaBtn.addEventListener('click', ()=>{
    state.mostrarFormPiloto = !state.mostrarFormPiloto;
    altaBtn.textContent = state.mostrarFormPiloto ? 'Cancelar' : '+ Agregar piloto';
    contenedorFormAlta.innerHTML = '';
    if(state.mostrarFormPiloto){
      contenedorFormAlta.appendChild(renderFormAltaPiloto(()=>{ state.mostrarFormPiloto=false; render(); }));
    }
  });

  const buscador = el('input',{type:'text', placeholder:'Buscar piloto por nombre...'});
  buscador.value = state.busquedaPiloto || '';
  buscador.style.cssText = 'width:100%;padding:10px 12px;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;color:var(--text);font-size:14px;margin-bottom:16px;';
  buscador.addEventListener('input', ()=>{ state.busquedaPiloto = buscador.value; renderizarListaPilotos(); });
  content.appendChild(buscador);

  content.appendChild(el('div',{class:'sub', style:'margin-bottom:12px;color:var(--muted);font-size:12px;'},'Toca un piloto para ver su bitácora completa.'));
  const list = el('div',{class:'pilot-list'});
  content.appendChild(list);

  function renderizarListaPilotos(){
    list.innerHTML = '';
    const filtro = (state.busquedaPiloto||'').trim().toLowerCase();
    r.pilotos
      .filter(p => !filtro || (p.nombre+' '+p.apellido).toLowerCase().includes(filtro))
      .sort((a,b)=> b.totales.TotalHoras - a.totales.TotalHoras)
      .forEach(p=>{
        const item = el('div',{class:'pilot-item'},[
          el('div',{},[
            el('div',{class:'name'}, p.nombre+' '+p.apellido),
            el('div',{class:'meta'}, 'Lic. '+(p.licencia||'-')+' · '+p.vuelos.length+' vuelos registrados')
          ]),
          el('div',{class:'hours mono'}, fmt(p.totales.TotalHoras)+' h')
        ]);
        item.addEventListener('click', ()=>{state.adminSelected=p.usuario; state.paginaTabla=null; render();});
        list.appendChild(item);
      });
    if(!list.children.length){
      list.appendChild(el('div',{class:'empty'},'No se encontraron pilotos.'));
    }
  }
  renderizarListaPilotos();
}

function renderFormAltaPiloto(onCreated){
  const card = el('div',{class:'card'});
  card.appendChild(el('h3',{},'Nuevo piloto'));
  card.appendChild(el('div',{class:'sub'},'Se crea con Rol = piloto. El usuario y la clave se los pasas tú al alumno.'));

  const grid = el('div',{class:'grid'});
  const fields = {};
  function f(key,label,type='text'){
    const inp = el('input',{type:type});
    fields[key]=inp;
    grid.appendChild(campoConEtiqueta(label, inp));
  }
  f('Usuario','Usuario');
  f('Clave','Clave');
  f('Nombre','Nombre');
  f('Apellido','Apellido');
  f('Licencia','Licencia');
  f('Numero','N°');
  f('Legajo','Legajo');
  card.appendChild(grid);

  const errorBox = el('div',{class:'error-msg', style:'display:none;'});
  const btn = el('button',{class:'btn-primary', style:'max-width:220px;margin-top:14px;'},'Crear piloto');
  btn.addEventListener('click', async ()=>{
    if(!fields.Usuario.value.trim() || !fields.Clave.value.trim()){
      errorBox.textContent = 'Usuario y clave son obligatorios.';
      errorBox.style.display='block';
      return;
    }
    errorBox.style.display='none';
    btn.disabled=true; btn.textContent='Creando...';
    const data = {action:'crearPiloto'};
    Object.entries(fields).forEach(([k,inp])=>{ data[k]=inp.value.trim(); });
    try{
      const r = await apiPost(data);
      if(r.ok){ showToast('Piloto creado ✓'); onCreated && onCreated(); }
      else { errorBox.textContent = r.error || 'Error al crear el piloto'; errorBox.style.display='block'; }
    }catch(e){ errorBox.textContent='No se pudo conectar.'; errorBox.style.display='block'; }
    btn.disabled=false; btn.textContent='Crear piloto';
  });
  card.appendChild(errorBox);
  card.appendChild(btn);
  return card;
}

render();
</script>
